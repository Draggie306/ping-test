<!DOCTYPE html>
<html>
<head>
    <title>Infinite Ping Test via Cloudflare Workers and WebSockets</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src = "pingtest.js"></script>
    <meta name="description" content="Infinitely ping a server using Cloudflare Workers and WebSockets.">
    <meta name="keywords" content="Cloudflare, Workers, WebSockets, Ping, Test">
    
    <script
    src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js">
    </script>

</head>

<body>
    <h1>Infinite Ping Test via Cloudflare Workers and WebSockets</h1>

    <h2>Results</h2>
    <p id="lastPingResult">Latest ping result: N/A</p>
    <p id="pingResults">Ping results: N/A</p>

    <h2>Start the test</h2>
    <p>Click the button below to start the ping test.</p>
    <button id="startButton" onclick="startPingTest()">Start Ping Test</button>
    <br>
    <input type="text" id="pingInterval" placeholder="Ping interval in milliseconds" value="20">
    <input type="text" id="websocketUrl" placeholder="Websocket Server" value="ping-test.draggie.games" disabled>

    <h2>Chart</h2>
    <canvas id="pingChart" style="width:100%;max-width:700px"></canvas>

</body>

</html>
